<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio Website">
    <meta name="keywords" content="Portfolio, Developer, Web Developer">
    <meta name="author" content="Portfolio Owner">
    <meta name="title" content="Portfolio Website">
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="#home" class="nav-brand">Portfolio</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="navMenu">
                    <!-- Navigation menu will be populated by JavaScript -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="home">
        <div class="container">
            <div class="hero-content">
                <div class="hero-text">
                    <h1 class="hero-title">Loading...</h1>
                    <p class="hero-subtitle">Loading...</p>
                    <p class="hero-description">Loading...</p>
                    <div class="hero-buttons">
                        <!-- Buttons will be populated by JavaScript -->
                    </div>
                    <div class="social-links">
                        <!-- Social links will be populated by JavaScript -->
                    </div>
                </div>
                <div class="hero-image">
                    <div class="avatar">
                        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="100" cy="100" r="100" fill="var(--color-bg-1)"/>
                            <circle cx="100" cy="80" r="30" fill="var(--color-primary)"/>
                            <path d="M60 140c0-22.091 17.909-40 40-40s40 17.909 40 40v40H60v-40z" fill="var(--color-primary)"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section class="about" id="about">
        <div class="container">
            <h2 class="section-title">About Me</h2>
            <div class="about-content">
                <div class="about-text">
                    <p class="about-summary">Loading...</p>
                    <p class="about-story">Loading...</p>
                    <div class="about-values">
                        <h3>Loading...</h3>
                        <ul>
                            <!-- Values will be populated by JavaScript -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Skills Section -->
    <section class="skills" id="skills">
        <div class="container">
            <h2 class="section-title">Skills & Technologies</h2>
            <div class="skills-grid">
                <!-- Skills will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section class="projects" id="projects">
        <div class="container">
            <h2 class="section-title">Featured Projects</h2>
            <div class="projects-grid">
                <!-- Projects will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Blog Section -->
    <section class="blog" id="blog">
        <div class="container">
            <h2 class="section-title">Latest Blog Posts</h2>
            <div class="blog-grid">
                <!-- Blog posts will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Experience Section -->
    <section class="experience" id="experience">
        <div class="container">
            <h2 class="section-title">Experience & Education</h2>
            <div class="timeline">
                <!-- Timeline will be populated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact" id="contact">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <h3>Loading...</h3>
                    <p>Loading...</p>
                    <div class="contact-details">
                        <!-- Contact details will be populated by JavaScript -->
                    </div>
                </div>
                <form class="contact-form" id="contactForm">
                    <!-- Form fields will be populated by JavaScript -->
                    <button type="submit" class="btn btn--primary btn--full-width">Send Message</button>
                    <div class="form-success hidden" id="formSuccess">Thank you! Your message has been sent.</div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>Loading...</p>
                <div class="footer-links">
                    <!-- Footer links will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
